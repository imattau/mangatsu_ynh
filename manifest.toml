#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mangatsu"
name = "Mangatsu"
description.en = "Comic and manga reader/publisher for the Nostr network"
description.fr = "Lecteur et éditeur de bandes dessinées/mangas pour le réseau Nostr"

version = "0.1.0~ynh1"

maintainers = []

[upstream]
license = "LGPL-2.1-only"
code = "https://github.com/imattau/Mangatsu"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "700M"
ram.build = "1G"
ram.runtime = "10M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mangatsu"

    [install.init_main_permission]
    # Mangatsu has its own Nostr-based sign-in (NIP-07 extension, pasted
    # nsec, bunker/NIP-46) that is entirely independent of YunoHost
    # accounts — matches ldap = false / sso = false above. Default to
    # public so the feed/library are actually reachable without a
    # YunoHost account; readers can always be restricted to a group
    # after install.
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/Mangatsu/archive/refs/tags/v0.1.0.tar.gz"
    sha256 = "251f9a8f5de693df8796d350d9443e58ba097d674ad03124d6ec94f3ab482990"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    # Mangatsu is a pure client-side Vite/React SPA: there is no Node
    # process at runtime, only at build time (npm ci && npm run build).
    # Pin a recent LTS since the toolchain (Vite 8, TypeScript 6) targets
    # current Node.
    version = "22"
