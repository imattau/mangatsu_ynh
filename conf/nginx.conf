# Mangatsu is a static Vite/React SPA: NGINX serves dist/ directly, no
# reverse proxy to a backend. Hashed assets are cached aggressively; the
# service worker script must always be revalidated so updates roll out
# promptly; unmatched app routes fall back to index.html for client-side
# routing.

location __PATH__/assets/ {
    alias __INSTALL_DIR__/dist/assets/;
    try_files $uri =404;
    expires 30d;
    more_set_headers "Cache-Control: public, immutable";
}

location = __PATH__/sw.js {
    alias __INSTALL_DIR__/dist/sw.js;
    more_set_headers "Cache-Control: no-cache";
}

location __PATH__/ {
    alias __INSTALL_DIR__/dist/;
    index index.html;
    try_files $uri $uri/ __PATH__/index.html;
}
